[project]
name = "rvr"
version = "0.1.0"
description = "Ranking harness artifacts by evaluation-awareness leakage"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "datasets>=2.19",
]

[project.optional-dependencies]
# Probe arm. bitsandbytes provides 8-bit/4-bit loading, which a 16GB T4 needs:
# Llama-3.1-8B in fp16 is ~16.1GB of weights before any activations.
gpu = [
    "torch>=2.3",
    "transformers>=4.44",
    "accelerate>=0.30",
    "bitsandbytes>=0.43",
]
# Behavioral arm (§6). Separate because vLLM pins torch versions and does not
# need to be installed for the probe arm.
behavioral = ["vllm>=0.5"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
