[project]
name = "rvr"
version = "0.1.0"
description = "Ranking harness artifacts by evaluation-awareness leakage"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "datasets>=2.19",
]

[project.optional-dependencies]
gpu = ["torch>=2.3", "transformers>=4.44", "vllm>=0.5"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
